<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mahjooz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>mahjooz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="preview-loading" style="position:fixed;inset:0;display:grid;place-items:center;background:#f8fcf7;color:#183321;font:600 18px system-ui,sans-serif">
    Loading Mahjooz…
  </div>
  <script>
    // A previous preview build may have installed Flutter's service worker.
    // Remove it so edited builds are not hidden behind an old offline cache.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async registrations => {
        await Promise.all(registrations.map(registration => registration.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('flutter-')).map(key => caches.delete(key)));
        }
        if (navigator.serviceWorker.controller && !sessionStorage.getItem('mahjooz-cache-cleared')) {
          sessionStorage.setItem('mahjooz-cache-cleared', '1');
          location.reload();
        }
      });
    }
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('preview-loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
